  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}
    aside{background:#fff;border-right:1px solid var(--line);padding:27px 18px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;gap:11px;align-items:center;padding:0 9px;font-weight:750;font-size:19px;letter-spacing:.02em}.logo{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,#958cff,#6458dc);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 6px 14px #7066e844}.nav-label{font-size:11px;color:#a5a8b5;letter-spacing:.11em;text-transform:uppercase;padding:0 10px;margin-bottom:8px}.nav{display:grid;gap:4px}.nav button{width:100%;border:0;background:transparent;color:#777b8e;border-radius:10px;text-align:left;padding:10px 12px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{color:var(--purple);background:var(--purple-light)}.nav .icon{width:18px;text-align:center;font-size:16px}.side-card{background:#faf9ff;border:1px solid #eeecff;border-radius:15px;padding:15px;margin-top:auto}.side-card strong{font-size:13px}.side-card p{font-size:12px;color:var(--muted);margin:6px 0 12px}.progress{height:6px;border-radius:6px;background:#e8e6fb;overflow:hidden}.progress i{display:block;width:62%;height:100%;background:var(--purple);border-radius:6px}.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.profile{display:flex;align-items:center;gap:10px;padding:0 7px}.avatar{width:35px;height:35px;border-radius:50%;background:#fce3d9;color:#a55b3f;display:grid;place-items:center;font-weight:700}.profile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.main{min-width:0;padding:28px clamp(18px,3vw,42px) 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.greeting{font-size:13px;color:var(--muted)}h1{font-size:25px;letter-spacing:-.03em;margin:2px 0 0}.top-actions{display:flex;align-items:center;gap:10px}.search{height:38px;width:195px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;outline:none}.search:focus{border-color:#b9b2ff}.icon-btn,.today-btn{border:1px solid var(--line);background:#fff;color:#686d80;border-radius:9px;height:38px;padding:0 12px}.primary{background:var(--purple);color:white;border:0;border-radius:9px;height:39px;padding:0 15px;font-weight:650;box-shadow:0 5px 12px #7066e833}.primary:hover{background:#5e54d4}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:23px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #30345104}.sum-label{font-size:12px;color:var(--muted)}.sum-value{font-size:23px;font-weight:740;margin-top:3px;letter-spacing:-.04em}.sum-note{font-size:11px;color:#a0a3b0;margin-top:3px}.sum-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px}.si-purple{background:var(--purple-light);color:var(--purple)}.si-green{background:var(--green-light);color:var(--green)}.si-orange{background:var(--orange-light);color:var(--orange)}.calendar-panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.cal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line);gap:12px}.week-title{font-size:16px;font-weight:700}.week-sub{font-size:11px;color:var(--muted);margin-top:3px}.cal-controls{display:flex;align-items:center;gap:7px}.week-arrow{width:33px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#73778a}.view-select{height:33px;border:1px solid var(--line);border-radius:8px;background:white;color:#6f7385;padding:0 9px;font-size:12px}.calendar-scroll{overflow:auto}.calendar{min-width:760px}.days-head{display:grid;grid-template-columns:58px repeat(7,minmax(90px,1fr));border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}.day-heading{height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid #f0f1f5;color:#7d8192;font-size:11px;gap:3px}.day-heading b{font-size:14px;color:var(--ink)}.day-heading.today{background:#faf9ff;color:var(--purple)}.day-heading.today b{color:var(--purple);width:25px;height:25px;display:grid;place-items:center;background:var(--purple-light);border-radius:50%}.all-day-row{display:grid;grid-template-columns:58px repeat(7,minmax(90px,1fr));min-height:54px;border-bottom:1px solid var(--line);background:#fcfcfe}.all-day-label{font-size:10px;color:#a0a3b0;padding:10px 8px;text-align:right}.all-day-cell{border-left:1px solid #f0f1f5;padding:5px 4px;min-height:50px}.all-day-cell.holiday{background:#fff8f2}.holiday-label{display:block;color:#c77c40;font-size:10px;padding:3px 4px}.day-heading.holiday{background:#fffaf5}.day-heading.holiday:after{content:"假日";font-size:9px;color:#ce8955;margin-top:-2px}.all-chip{display:block;background:#f2f0ff;color:#6d62d9;border-radius:5px;padding:4px 6px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0}.time-body{display:grid;grid-template-columns:58px repeat(7,minmax(90px,1fr));position:relative}.time-labels{position:relative}.time-label{height:var(--hour);font-size:10px;color:#a2a5b2;text-align:right;padding:0 9px;transform:translateY(-7px)}.day-column{height:calc(var(--hour)*13);position:relative;border-left:1px solid #f0f1f5;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),#eff0f5 calc(var(--hour) - 1px),#eff0f5 var(--hour))}.day-column.today{background-color:#fdfcff}.event{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 7px;overflow:hidden;font-size:10px;line-height:1.35;border-left:3px solid;z-index:1;cursor:pointer;transition:filter .15s,transform .15s}.event:hover{filter:saturate(1.15);transform:translateY(-1px);z-index:2}.event strong{display:block;font-size:10px;font-weight:700;margin-bottom:2px}.event small{display:block;font-size:9px;opacity:.75}.event.life{background:var(--orange-light);color:#a76b17;border-color:#e9ac53}.event.study{background:var(--blue-light);color:#4775b8;border-color:#72a1e7}.event.leisure{background:var(--teal-light);color:#218c7f;border-color:#45b8a7}.event.task{background:var(--green-light);color:#2e8d6f;border-color:#53b895}.event.purple{background:var(--purple-light);color:#675cce;border-color:#9388f2}.now-line{position:absolute;left:58px;right:0;z-index:2;border-top:1px solid #ec6e6e;pointer-events:none}.now-line:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ec6e6e;left:-4px;top:-4px}.empty-note{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);color:#c0c2cc;font-size:11px;white-space:nowrap;pointer-events:none}.footer-note{font-size:11px;color:#a1a4b1;padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.legend{display:flex;align-items:center;gap:14px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%}.dot.life{background:var(--orange)}.dot.study{background:var(--blue)}.dot.leisure{background:var(--teal)}.dot.task{background:var(--green)}
.workspace-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:6px 0 22px}.back-calendar{border:0;background:transparent;color:var(--purple);padding:0;margin-bottom:12px;font-size:12px}.workspace-description{color:var(--muted);font-size:12px;margin:6px 0 0}.section-card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #30345108;margin-bottom:14px;padding:17px 19px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}.today-date{font-size:11px;color:var(--muted);font-weight:400}.task-list{display:grid}.task-row{display:grid;grid-template-columns:90px 20px minmax(0,1fr) auto;align-items:center;gap:11px;padding:12px 3px;border-top:1px solid #f0f1f5}.task-time{font-size:12px;color:#74798c;font-variant-numeric:tabular-nums}.task-check{width:16px;height:16px;accent-color:var(--purple)}.task-name{font-weight:650;font-size:13px}.task-meta{font-size:11px;color:var(--muted);margin-top:3px}.task-tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#f3f3f7;color:#777b8b;white-space:nowrap}.task-tag.study{background:var(--blue-light);color:#4775b8}.task-tag.leisure{background:var(--teal-light);color:#218c7f}.task-tag.life{background:var(--orange-light);color:#a76b17}.task-tag.task{background:var(--green-light);color:#2e8d6f}.task-row.done .task-name{text-decoration:line-through;color:#a3a6b3}.folder-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 15px}.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.folder-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:140px;cursor:pointer;transition:.15s}.folder-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d9d5ff}.folder-icon{width:39px;height:39px;border-radius:12px;background:var(--blue-light);color:#5883c3;display:grid;place-items:center;font-size:18px;margin-bottom:12px}.folder-name{font-weight:700}.folder-sub{font-size:11px;color:var(--muted);margin-top:4px}.folder-progress{height:5px;background:#eff0f6;border-radius:5px;margin-top:12px;overflow:hidden}.folder-progress i{display:block;height:100%;background:var(--blue);border-radius:5px}.study-list{display:grid;gap:9px}.study-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fafbfe;border:1px solid #eff0f5;padding:12px;border-radius:10px}.study-item strong{font-size:12px}.study-item small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.text-button{border:0;background:transparent;color:var(--purple);font-size:12px;padding:5px}.empty-state{text-align:center;padding:36px 16px;color:var(--muted);font-size:12px}.folder-detail-head{display:flex;align-items:center;gap:12px;margin:12px 0}.folder-detail-head .folder-icon{margin:0}
    .modal-backdrop{position:fixed;inset:0;background:#24243c55;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(500px,100%);max-height:92vh;overflow:auto;border-radius:17px;box-shadow:0 24px 80px #1d1b3d33;padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f4f4f8;width:30px;height:30px;border-radius:8px;color:#777}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#73778a;font-weight:600}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;outline:none;color:var(--ink);background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a69fff;box-shadow:0 0 0 3px #f0efff}.field textarea{resize:vertical;min-height:66px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.secondary{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#74788a}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#29283e;color:#fff;padding:10px 15px;border-radius:9px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:20;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:950px){.app{grid-template-columns:72px minmax(0,1fr)}aside{padding:21px 10px;align-items:center}.brand{padding:0}.brand-name,.nav-label,.nav-text,.side-card,.profile-info{display:none}.nav{width:100%;margin-top:15px}.nav button{justify-content:center;padding:11px 4px}.profile{margin-top:auto;padding:0}.main{padding:22px 18px}.search{width:150px}}
    @media(max-width:620px){.workspace-header{align-items:flex-start}.task-row{grid-template-columns:65px 18px minmax(0,1fr)}.task-tag{display:none}.section-card{padding:14px}.folder-grid{grid-template-columns:1fr 1fr}.folder-card{padding:12px;min-height:125px}.task-time{font-size:10px}}
    @media(max-width:620px){.app{display:block}aside{display:none}.main{padding:17px 12px}.topbar{align-items:flex-start;margin-bottom:17px}.greeting{font-size:11px}h1{font-size:21px}.top-actions{gap:6px}.search{display:none}.primary{height:36px;padding:0 11px;font-size:12px}.summary{gap:7px;margin-bottom:14px}.summary-card{padding:11px 10px;border-radius:11px;align-items:flex-start}.sum-label{font-size:10px}.sum-value{font-size:19px}.sum-note{display:none}.sum-icon{width:29px;height:29px;border-radius:9px;font-size:14px}.cal-head{padding:13px 12px}.week-title{font-size:14px}.week-sub{font-size:10px}.view-select{display:none}.footer-note{padding:10px 12px}.legend{gap:8px}.footer-note>span:last-child{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:18px}.calendar-scroll{max-height:calc(100vh - 340px)}}
  </style>

<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">✦</div><span class="brand-name">日序 <span style="font-weight:400;color:#9699a8">DAYFLOW</span></span></div>
    <div style="width:100%"><div class="nav-label">工作區</div><nav class="nav"><button class="active" data-nav="週曆"><span class="icon">▦</span><span class="nav-text">週曆</span></button><button data-nav="今日任務"><span class="icon">☑</span><span class="nav-text">今日任務</span></button><button data-nav="學習計畫"><span class="icon">▤</span><span class="nav-text">學習計畫</span></button><button data-nav="生活記錄"><span class="icon">♡</span><span class="nav-text">生活記錄</span></button></nav></div>
    <div style="width:100%"><div class="nav-label">偏好</div><nav class="nav"><button data-nav="設定"><span class="icon">⚙</span><span class="nav-text">設定</span></button></nav></div>
    <div class="side-card"><strong>本週學習目標</strong><p>再一點點，就完成本週目標了！</p><div class="progress"><i></i></div><div class="progress-meta"><span>3.1 / 5 小時</span><span>62%</span></div></div>
    <div class="profile"><div class="avatar">林</div><div class="profile-info"><b>林同學</b><small>個人工作區</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar" id="mainTopbar"><div><div class="greeting" id="greeting">把重要的事，安排進生活裡。</div><h1>我的週計畫</h1></div><div class="top-actions"><input class="search" id="search" placeholder="⌕　搜尋行程與任務" /><button class="icon-btn" id="todayShortcut" title="返回本週">⌕ 今天</button><button class="primary" id="addBtn">＋ 新增項目</button></div></header>
    <section class="summary" id="weekSummary"><div class="summary-card"><div><div class="sum-label">本週待完成</div><div class="sum-value" id="taskCount">0</div><div class="sum-note">保持步調，不必急著全做完</div></div><div class="sum-icon si-purple">✓</div></div><div class="summary-card"><div><div class="sum-label">本週學習時數</div><div class="sum-value" id="studyHours">0<span style="font-size:13px;font-weight:500"> 小時</span></div><div class="sum-note">持續累積，就會看見進步</div></div><div class="sum-icon si-green">◷</div></div><div class="summary-card"><div><div class="sum-label">下一個提醒</div><div class="sum-value" style="font-size:18px" id="nextReminder">尚無提醒</div><div class="sum-note" id="nextReminderTitle">新增提醒，照顧重要的事</div></div><div class="sum-icon si-orange">♧</div></div></section>
    <section class="calendar-panel" id="weekCalendar"><div class="cal-head"><div><div class="week-title" id="weekTitle">載入中</div><div class="week-sub">每週安排一目了然，留點空間給自己</div></div><div class="cal-controls"><button class="week-arrow" id="prevWeek" aria-label="上一週">‹</button><button class="week-arrow" id="nextWeek" aria-label="下一週">›</button><button class="today-btn" id="todayBtn" style="height:32px;font-size:12px">本週</button><select class="view-select" aria-label="檢視方式"><option>週檢視</option></select></div></div>
      <div class="calendar-scroll" id="calendarScroll"><div class="calendar"><div class="days-head" id="daysHead"></div><div class="all-day-row" id="allDayRow"></div><div class="time-body" id="timeBody"></div></div></div>
      <div class="footer-note"><div class="legend"><span><i class="dot life"></i>生活</span><span><i class="dot study"></i>學習</span><span><i class="dot leisure"></i>日常休閒</span><span><i class="dot task"></i>待辦</span></div><span>點擊「＋新增項目」安排你的下一步</span></div>
    </section>
    <section id="workspaceView" style="display:none"><div class="workspace-header"><div><button class="back-calendar" id="backCalendar">← 回到週曆</button><div class="greeting" id="workspaceEyebrow">工作區</div><h1 id="workspaceTitle">今日任務</h1><p id="workspaceDescription" class="workspace-description"></p></div><button class="primary" id="workspaceAddBtn">＋ 新增</button></div><div id="workspaceContent"></div></section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">新增項目</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div><form id="itemForm"><div class="form-grid"><div class="field full"><label for="title">項目名稱 *</label><input id="title" required maxlength="60" placeholder="例如：日文單字複習" /></div><div class="field"><label for="category">分類</label><select id="category"><option value="study">學習</option><option value="leisure">日常休閒</option><option value="life">生活</option><option value="task">待辦</option></select></div><div class="field"><label for="date">日期 *</label><input id="date" type="date" required /></div><div class="field"><label for="start">開始時間</label><input id="start" type="time" value="09:00" /></div><div class="field"><label for="end">結束時間</label><input id="end" type="time" value="10:00" /></div><div class="field"><label for="reminder">提醒時間</label><input id="reminder" type="datetime-local" /></div><div class="field"><label for="repeat">重複</label><select id="repeat"><option value="none">不重複</option><option value="daily">每天</option><option value="weekly">每週</option><option value="monthly">每月</option></select></div><div class="field full" id="skipHolidayWrap"><label style="display:flex;align-items:center;gap:8px;color:#666b7d;font-weight:500"><input id="skipHolidays" type="checkbox" checked style="accent-color:#7066e8"> 國定假日／補假自動跳過（只適用重複項目）</label><small style="color:#a0a3b0;font-size:11px">假日當天不顯示此行程；不會刪除行程或影響其他日期。</small></div><div class="field full" id="subjectWrap" style="display:none"><label for="subject">科目資料夾</label><select id="subject"></select></div><div class="field full"><label for="note">備註（選填）</label><textarea id="note" maxlength="180" placeholder="補充細節或提醒自己…"></textarea></div></div><div class="form-actions"><button type="button" class="secondary" id="cancelModal">取消</button><button type="submit" class="primary">儲存項目</button></div></form></section></div><div class="toast" id="toast"></div>
<script>
(()=>{
  const DAY=['日','一','二','三','四','五','六'], STORE='dayflow.items.v1';
  const today=new Date();today.setHours(0,0,0,0);
  const localDate=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
  const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const mondayOf=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x};
  const FOLDER_STORE='dayflow.subjectFolders.v1', DONE_STORE='dayflow.completed.v1';
  let weekStart=mondayOf(today), items=load(), searchTerm='', activeView='週曆', activeFolder=null;
  let folders=readStore(FOLDER_STORE,[{id:'subject-english',name:'英文',color:'#6d91d4'},{id:'subject-japanese',name:'日文',color:'#d27c8c'},{id:'subject-research',name:'使用者研究',color:'#8c79d8'}]);
  let completed=readStore(DONE_STORE,{});
  function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
  function saveFolders(){localStorage.setItem(FOLDER_STORE,JSON.stringify(folders))}
  function saveCompleted(){localStorage.setItem(DONE_STORE,JSON.stringify(completed))}
  // 台灣 2026 年國定假日與補假（原型內建；正式產品建議改接年度行事曆資料源）
  const HOLIDAYS={'2026-01-01':'元旦','2026-02-16':'農曆除夕','2026-02-17':'春節','2026-02-18':'春節','2026-02-19':'春節','2026-02-20':'春節','2026-02-27':'和平紀念日補假','2026-02-28':'和平紀念日','2026-04-03':'兒童節補假','2026-04-04':'兒童節','2026-04-05':'清明節','2026-04-06':'清明節補假','2026-05-01':'勞動節','2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-28':'教師節','2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'光復節','2026-10-26':'光復節補假','2026-12-25':'行憲紀念日'};
  const holidayOn=date=>HOLIDAYS[date]||'';
  function shouldSkipOnHoliday(item,date){return item.skipHolidays&&item.repeat!=='none'&&!!holidayOn(date)}
  function load(){try{return JSON.parse(localStorage.getItem(STORE))||seed()}catch{return seed()}}
  function save(){localStorage.setItem(STORE,JSON.stringify(items))}
  function seed(){const monday=mondayOf(today), at=(offset,time)=>{const d=new Date(monday);d.setDate(d.getDate()+offset);return {date:localDate(d),time}};return [
    {id:'s1',title:'晨間伸展與散步',category:'life',...at(0,'07:30'),end:'08:15',reminder:'',repeat:'daily',note:''},
    {id:'s2',title:'英文線上課程',category:'study',subjectId:'subject-english',...at(0,'09:00'),end:'10:30',reminder:'',repeat:'weekly',skipHolidays:true,note:''},
    {id:'s3',title:'整理本週待辦清單',category:'task',...at(0,'11:00'),end:'11:45',reminder:'',repeat:'none',note:''},
    {id:'s4',title:'專題閱讀：使用者研究',category:'study',subjectId:'subject-research',...at(1,'14:00'),end:'16:00',reminder:'',repeat:'weekly',skipHolidays:true,note:''},
    {id:'s5',title:'採買日用品',category:'life',...at(2,'17:00'),end:'18:00',reminder:'',repeat:'none',note:''},
    {id:'s6',title:'完成課程筆記',category:'task',...at(3,'10:00'),end:'11:00',reminder:'',repeat:'none',note:''},
    {id:'s7',title:'瑜伽練習',category:'leisure',...at(4,'19:00'),end:'20:00',reminder:'',repeat:'weekly',skipHolidays:false,note:''},
    {id:'s8',title:'複習日文單字',category:'study',subjectId:'subject-japanese',...at(5,'09:30'),end:'10:30',reminder:'',repeat:'daily',skipHolidays:true,note:''},
    {id:'s9',title:'安排下週計畫',category:'task',...at(6,'15:00'),end:'15:45',reminder:'',repeat:'weekly',note:''}
  ]}
  const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){
    const end=new Date(weekStart);end.setDate(end.getDate()+6);
    $('#weekTitle').textContent=`${weekStart.getFullYear()}年 ${weekStart.getMonth()+1}月 ${weekStart.getDate()}日 — ${end.getMonth()+1}月 ${end.getDate()}日`;
    const dates=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d});
    $('#daysHead').innerHTML='<div></div>'+dates.map(d=>{const date=localDate(d),holiday=holidayOn(date);return `<div class="day-heading ${date===localDate(today)?'today':''} ${holiday?'holiday':''}">${DAY[d.getDay()]}<b>${d.getDate()}</b>${holiday?`<span title="${esc(holiday)}">${esc(holiday)}</span>`:''}</div>`}).join('');
    const weeklyItems=items.filter(x=>{const d=parseDate(x.date);return d>=weekStart&&d<=end&&(!searchTerm||(x.title+' '+x.note).toLowerCase().includes(searchTerm))});
    $('#allDayRow').innerHTML='<div class="all-day-label">整天</div>'+dates.map(d=>{const date=localDate(d),holiday=holidayOn(date);return `<div class="all-day-cell ${holiday?'holiday':''}">${holiday?`<span class="holiday-label">☀ ${esc(holiday)}</span>`:''}${weeklyItems.filter(x=>x.date===date&&!x.time&&!shouldSkipOnHoliday(x,date)).map(x=>`<span class="all-chip" data-item="${esc(x.id)}">${esc(x.title)}</span>`).join('')}</div>`}).join('');
    const labels=Array.from({length:13},(_,i)=>`<div class="time-label">${String(i+7).padStart(2,'0')}:00</div>`).join('');
    const cols=dates.map(d=>{const date=localDate(d);return `<div class="day-column ${date===localDate(today)?'today':''} ${holidayOn(date)?'holiday':''}" data-date="${date}"><div class="empty-note" style="display:none">點一下空白處新增</div>`}).join('');
    $('#timeBody').innerHTML=`<div class="time-labels">${labels}</div>${cols}`;
    weeklyItems.filter(x=>x.time&&!shouldSkipOnHoliday(x,x.date)).forEach(x=>{const col=$(`.day-column[data-date="${x.date}"]`);if(!col)return;const [h,m]=x.time.split(':').map(Number),[eh,em]=(x.end||x.time).split(':').map(Number);const top=(h-7+m/60)*64,height=Math.max(36,((eh*60+em)-(h*60+m))/60*64);const ev=document.createElement('div');ev.className=`event ${x.category}`;ev.style.top=`${top}px`;ev.style.height=`${height}px`;ev.dataset.item=x.id;ev.innerHTML=`<strong>${esc(x.title)}</strong><small>${x.time}${x.end?' – '+x.end:''}${x.reminder?'　♧':''}${x.repeat&&x.repeat!=='none'?'　↻':''}</small>`;col.appendChild(ev)});
    const pending=weeklyItems.filter(x=>x.category==='task').length;$('#taskCount').textContent=pending;
    const hours=weeklyItems.filter(x=>x.category==='study'&&x.time&&!shouldSkipOnHoliday(x,x.date)).reduce((sum,x)=>{const a=x.time.split(':').map(Number),b=(x.end||x.time).split(':').map(Number);return sum+Math.max(0,(b[0]*60+b[1]-a[0]*60-a[1])/60)},0);
    $('#studyHours').innerHTML=`${Number.isInteger(hours)?hours:hours.toFixed(1)}<span style="font-size:13px;font-weight:500"> 小時</span>`;
    const reminders=weeklyItems.filter(x=>x.reminder&&!shouldSkipOnHoliday(x,x.date)).sort((a,b)=>a.reminder.localeCompare(b.reminder));const next=reminders.find(x=>new Date(x.reminder)>=new Date());
    if(next){const dt=new Date(next.reminder);$('#nextReminder').textContent=`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;$('#nextReminderTitle').textContent=next.title}else{$('#nextReminder').textContent='尚無提醒';$('#nextReminderTitle').textContent='新增提醒，照顧重要的事'}
  }
  function openModal(date){$('#itemForm').reset();$('#date').value=date||localDate(today);$('#subject').innerHTML=folders.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');$('#subjectWrap').style.display=$('#category').value==='study'?'grid':'none';$('#category').onchange=()=>{$('#subjectWrap').style.display=$('#category').value==='study'?'grid':'none'};$('#start').value='09:00';$('#end').value='10:00';$('#skipHolidays').checked=true;$('#skipHolidayWrap').style.display='grid';$('#repeat').onchange=()=>{$('#skipHolidayWrap').style.display=$('#repeat').value==='none'?'none':'grid'};$('#modalBackdrop').classList.add('open');setTimeout(()=>$('#title').focus(),30)}
  function closeModal(){$('#modalBackdrop').classList.remove('open')}
  let toastTimer;function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
  $('#addBtn').addEventListener('click',()=>openModal());$('#closeModal').addEventListener('click',closeModal);$('#cancelModal').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
  $('#itemForm').addEventListener('submit',e=>{e.preventDefault();const start=$('#start').value,endTime=$('#end').value;if(start&&endTime&&endTime<=start){toast('結束時間需晚於開始時間');return}const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:$('#title').value.trim(),category:$('#category').value,date:$('#date').value,time:start,end:endTime,reminder:$('#reminder').value,repeat:$('#repeat').value,skipHolidays:$('#skipHolidays').checked,subjectId:$('#category').value==='study'?$('#subject').value:'',note:$('#note').value.trim()};if(!item.title||!item.date)return;items.push(item);save();closeModal();render();if(activeView!=='週曆')renderWorkspace();toast('已儲存項目；假日跳過及重複設定已記錄')});
  $('#prevWeek').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()-7);render()});$('#nextWeek').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()+7);render()});const goToday=()=>{weekStart=mondayOf(today);render()};$('#todayBtn').addEventListener('click',goToday);$('#todayShortcut').addEventListener('click',goToday);
  $('#search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();render()});
  document.addEventListener('click',e=>{const event=e.target.closest('[data-item]');if(event){const item=items.find(x=>x.id===event.dataset.item);if(item&&confirm(`「${item.title}」\n\n確定刪除此項目？`)){items=items.filter(x=>x.id!==item.id);save();render();if(activeView!=='週曆')renderWorkspace();toast('項目已刪除')}}const col=e.target.closest('.day-column');if(col&&e.target===col){openModal(col.dataset.date)}});
  document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-current','false')});btn.classList.add('active');btn.setAttribute('aria-current','page');showView(btn.dataset.nav)}));
  $('#backCalendar').addEventListener('click',()=>{document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav==='週曆');b.setAttribute('aria-current',b.dataset.nav==='週曆'?'page':'false')});showView('週曆')});
  $('#workspaceAddBtn').addEventListener('click',()=>{if(activeView==='今日任務')openModal(localDate(today));else if(activeFolder)createStudyItem();else createFolder()});
  // Support direct navigation by keyboard and keep the main workspace context visible.
  document.querySelectorAll('[data-nav]').forEach(btn=>btn.setAttribute('aria-current',btn.classList.contains('active')?'page':'false'));
  $('#workspaceContent').addEventListener('click',e=>{const folder=e.target.closest('[data-folder]');if(folder){activeFolder=folders.find(f=>f.id===folder.dataset.folder);renderWorkspace();return}const back=e.target.closest('[data-folder-back]');if(back){activeFolder=null;renderWorkspace();return}const create=e.target.closest('[data-create-folder]');if(create)createFolder()});
  $('#workspaceContent').addEventListener('change',e=>{const toggle=e.target.closest('[data-done]');if(toggle){completed[toggle.dataset.done]=toggle.checked;saveCompleted();renderWorkspace()}});
  function showView(view){activeFolder=null;const valid=['今日任務','學習計畫'].includes(view);if(!valid&&view!=='週曆'){toast(view+'功能將在後續版本展開');view='週曆';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav==='週曆'))}activeView=view;const isCalendar=view==='週曆';$('#mainTopbar').style.display=isCalendar?'flex':'none';$('#weekSummary').style.display=isCalendar?'grid':'none';$('#weekCalendar').style.display=isCalendar?'block':'none';$('#workspaceView').style.display=valid?'block':'none';if(valid)renderWorkspace();window.scrollTo({top:0,behavior:'smooth'})}
  function createFolder(){const name=prompt('請輸入科目名稱（例如：統計學）');if(!name||!name.trim())return;const colors=['#6d91d4','#d27c8c','#8c79d8','#45a38f','#dc9a53'];const folder={id:'subject-'+(crypto.randomUUID?crypto.randomUUID():Date.now()),name:name.trim(),color:colors[folders.length%colors.length]};folders.push(folder);saveFolders();activeFolder=folder;renderWorkspace();toast('已建立「'+folder.name+'」資料夾')}
  function createStudyItem(){openModal(localDate(today));$('#category').value='study';$('#subjectWrap').style.display='grid';$('#subject').value=activeFolder.id}
  function categoryName(c){return ({study:'學習',leisure:'日常休閒',life:'生活',task:'待辦'})[c]||c}
  function renderWorkspace(){const content=$('#workspaceContent'),title=$('#workspaceTitle'),eyebrow=$('#workspaceEyebrow'),desc=$('#workspaceDescription'),add=$('#workspaceAddBtn');if(activeView==='今日任務'){title.textContent='今日任務';eyebrow.textContent='TODAY';desc.textContent='依時間排序，掌握今天所有行程與待辦。';add.textContent='＋ 新增任務';const date=localDate(today),dayItems=items.filter(x=>x.date===date&&!shouldSkipOnHoliday(x,date)).sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00')),holiday=holidayOn(date);const rows=dayItems.map(x=>{const label=(x.time||'整天')+(x.end?' – '+x.end:'');return '<div class="task-row '+(completed[x.id]?'done':'')+'"><span class="task-time">'+esc(label)+'</span><input class="task-check" type="checkbox" data-done="'+esc(x.id)+'" '+(completed[x.id]?'checked':'')+' aria-label="標記完成"><div><div class="task-name">'+esc(x.title)+'</div><div class="task-meta">'+categoryName(x.category)+(x.reminder?' · 有提醒':'')+(x.repeat&&x.repeat!=='none'?' · 重複行程':'')+'</div></div><span class="task-tag '+esc(x.category)+'">'+categoryName(x.category)+'</span></div>'}).join('');content.innerHTML='<div class="section-card"><div class="section-title"><span>今天的安排</span><span class="today-date">'+today.getFullYear()+'/'+(today.getMonth()+1)+'/'+today.getDate()+' '+DAY[today.getDay()]+(holiday?' · '+esc(holiday):'')+'</span></div>'+(rows?'<div class="task-list">'+rows+'</div>':'<div class="empty-state">今天還沒有排定的行程，留點空白也很好。</div>')+'</div><div class="section-card"><div class="section-title"><span>今日摘要</span><span class="today-date">'+dayItems.length+' 個安排</span></div><div class="task-meta">學習 '+dayItems.filter(x=>x.category==='study').length+' 項 · 休閒 '+dayItems.filter(x=>x.category==='leisure').length+' 項 · 待辦 '+dayItems.filter(x=>x.category==='task').length+' 項</div></div>';return}title.textContent='學習計畫';eyebrow.textContent='STUDY LIBRARY';desc.textContent='先按科目建立資料夾，再把課程、複習與學習任務收進各自的空間。';add.textContent=activeFolder?'＋ 新增學習項目':'＋ 新增科目資料夾';if(activeFolder){const list=items.filter(x=>x.category==='study'&&x.subjectId===activeFolder.id).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));content.innerHTML='<div class="section-card"><button class="text-button" data-folder-back>← 所有科目</button><div class="folder-detail-head"><div class="folder-icon" style="background:'+activeFolder.color+'18;color:'+activeFolder.color+'">▤</div><div><strong>'+esc(activeFolder.name)+'</strong><div class="folder-sub">'+list.length+' 個學習項目</div></div></div><div class="study-list">'+(list.length?list.map(x=>'<article class="study-item"><div><strong>'+esc(x.title)+'</strong><small>'+esc(x.date)+' · '+esc(x.time||'整天')+(x.end?' – '+esc(x.end):'')+'</small></div><span class="task-tag study">學習</span></article>').join(''):'<div class="empty-state">這個科目資料夾還是空的，新增第一個學習項目吧。</div>')+'</div><button class="secondary" style="margin-top:13px" data-add-study>＋ 新增到「'+esc(activeFolder.name)+'」</button></div>';content.querySelector('[data-add-study]').addEventListener('click',createStudyItem);return}const cards=folders.map(f=>{const count=items.filter(x=>x.category==='study'&&x.subjectId===f.id).length;return '<article class="folder-card" data-folder="'+esc(f.id)+'"><div class="folder-icon" style="background:'+f.color+'18;color:'+f.color+'">▤</div><div class="folder-name">'+esc(f.name)+'</div><div class="folder-sub">'+count+' 個學習項目 · 點擊查看內容</div><div class="folder-progress"><i style="width:'+Math.min(100,count*12)+'%;background:'+f.color+'"></i></div></article>'}).join('');content.innerHTML='<div class="folder-toolbar"><span class="today-date">'+folders.length+' 個科目資料夾</span><button class="secondary" data-create-folder>＋ 新增科目</button></div>'+(cards?'<div class="folder-grid">'+cards+'</div>':'<div class="section-card empty-state">還沒有科目資料夾，先建立一個科目吧。</div>')}

  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  const hr=new Date().getHours();$('#greeting').textContent=hr<11?'早安，為今天留一點從容。':hr<18?'午安，把重要的事安排進生活裡。':'晚安，今天也辛苦了。';render();
})();
</script>
